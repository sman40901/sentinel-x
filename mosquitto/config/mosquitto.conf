# Mosquitto — Sentinel-X

per_listener_settings false

# --- Écoute interne / tests locaux (publiée seulement sur 127.0.0.1 côté PC) ---
listener 1883

# --- Écoute chiffrée pour l'ESP32 (Wi-Fi de table) ---
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# --- Authentification : pas de client anonyme ---
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/acl

# --- Protection contre la saturation (DoS du jeudi) ---
max_connections 50
message_size_limit 10240
max_queued_messages 1000
max_inflight_messages 20

# --- Persistance et logs (MCO) ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
