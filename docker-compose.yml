# Sentinel-X — stack serveur (PC Serveur Local, option B)
# Réseau interne sentinel_net 172.28.0.0/24 (voir schéma réseau)
#
#   docker compose up -d --build   -> mosquitto + db + api + nginx

x-logging: &logging           # MCO : rotation des logs Docker (max 3 x 10 Mo par conteneur)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening       # Durcissement commun à tous les conteneurs
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2
    container_name: sentinelx-mosquitto
    ports:
      - "8883:8883"             # MQTTS chiffré : ouvert au Wi-Fi de table (ESP32)
      - "127.0.0.1:1883:1883"   # MQTT clair : uniquement depuis le PC lui-même (tests)
    volumes:
      - ./mosquitto/config:/mosquitto/config-src:ro   # config du dépôt (lecture seule)
      - ./certs:/mosquitto/certs-src:ro               # certificats (lecture seule)
      - mosquitto_data:/mosquitto/data
    # Copie config + certs dans le conteneur avec les bons droits (corrige les droits sous Windows)
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /mosquitto/config /mosquitto/certs
        cp /mosquitto/config-src/* /mosquitto/config/
        cp /mosquitto/certs-src/ca.crt /mosquitto/certs-src/server.crt /mosquitto/certs-src/server.key /mosquitto/certs/
        chown -R mosquitto:mosquitto /mosquitto/config /mosquitto/certs /mosquitto/data
        chmod 600 /mosquitto/config/passwd /mosquitto/config/acl /mosquitto/certs/server.key
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    networks:
      sentinel_net:
        ipv4_address: 172.28.0.10
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: sentinelx-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      sentinel_net:
        ipv4_address: 172.28.0.30
    # Aucun port publié : la base n'est joignable que depuis le réseau Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    <<: *hardening
    build: ./api                # API FastAPI (port 8000, interne)
    container_name: sentinelx-api
    user: "1000:1000"           # pas de root dans le conteneur
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
      API_KEY: ${API_KEY}
      GROUP_ID: g01
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      sentinel_net:
        ipv4_address: 172.28.0.20
    # Aucun port publié : on passe par nginx (/api/)
    deploy:
      resources:
        limits:
          memory: 192M

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    container_name: sentinelx-nginx
    ports:
      - "443:443"               # HTTPS : dashboard + API
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./dashboard:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # accès au flux webcam du script IA (sur le PC)
    depends_on:
      - mosquitto
      - api
    networks:
      sentinel_net:
        ipv4_address: 172.28.0.40
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  sentinel_net:
    name: sentinel_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mosquitto_data:
  db_data:
