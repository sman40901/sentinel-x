# Sentinel-X — stack serveur (PC Serveur Local, option B)
# Réseau interne sentinel_net 172.20.0.0/24 (voir schéma réseau)
#
#   docker compose up -d --build   -> mosquitto + db + api + nginx

x-logging: &logging           # MCO : rotation des logs Docker (max 3 x 10 Mo par conteneur)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening       # Durcissement commun à tous les conteneurs
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2
    container_name: sentinelx-mosquitto
    ports:
      - "8883:8883"             # MQTTS chiffré : ouvert au Wi-Fi de table (ESP32)
      - "127.0.0.1:1883:1883"   # MQTT clair : uniquement depuis le PC lui-même (tests)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./certs:/mosquitto/certs
      - mosquitto_data:/mosquitto/data
    networks:
      sentinel_net:
        ipv4_address: 172.20.0.10
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: sentinelx-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      sentinel_net:
        ipv4_address: 172.20.0.30
    # Aucun port publié : la base n'est joignable que depuis le réseau Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    <<: *hardening
    build: ./api                # API FastAPI (port 8000, interne)
    container_name: sentinelx-api
    user: "1000:1000"           # pas de root dans le conteneur
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
      API_KEY: ${API_KEY}
      GROUP_ID: g02
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      sentinel_net:
        ipv4_address: 172.20.0.20
    # Aucun port publié : on passe par nginx (/api/)
    deploy:
      resources:
        limits:
          memory: 192M

  # --- Flux webcam ---------------------------------------------------------
  # Dans le reseau Docker, donc nginx l'atteint par son nom de service. Plus
  # besoin du detour par host.docker.internal, qui ne fonctionnait pas : nginx
  # resout un proxy_pass litteral via /etc/hosts, mais pas quand l'hote est
  # passe dans une variable.
  #
  # CAMERA_DEVICE designe la camera USB. Sur cette machine :
  #   /dev/video0,1 = webcam integree ASUS
  #   /dev/video2,3 = camera USB UGREEN   <- celle-la
  # Elle est exposee en /dev/video0 DANS le conteneur, pour que le code n'ait
  # pas a connaitre la numerotation de l'hote.
  stream:
    build: ./stream
    container_name: sentinelx-stream
    restart: unless-stopped
    devices:
      - "${CAMERA_DEVICE:-/dev/video2}:/dev/video0"
    environment:
      CAMERA_INDEX: "0"
      FRAME_WIDTH: "${FRAME_WIDTH:-640}"
      FRAME_HEIGHT: "${FRAME_HEIGHT:-480}"
      GROUP_ID: "${GROUP_ID:-g02}"
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_USERNAME: ia
      MQTT_PASSWORD: "${MQTT_IA_PASSWORD}"
      MQTT_CA_CERT: /certs/ca.crt
      FACE_MATCH_THRESHOLD: "${FACE_MATCH_THRESHOLD:-0.363}"
      FACE_CONFIDENCE: "${FACE_CONFIDENCE:-0.60}"
    volumes:
      - ./certs:/certs:ro
      - vision_data:/data        # visages autorises + instantanes
    depends_on: [mosquitto]
    networks: [sentinel_net]
    # Aucun port publie : seul nginx y accede, depuis le reseau Docker.

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    container_name: sentinelx-nginx
    ports:
      - "443:443"               # HTTPS : dashboard + API
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./certs:/etc/nginx/certs:ro
      - ./dashboard:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # accès au flux webcam du script IA (sur le PC)
    depends_on:
      - mosquitto
      - api
    networks:
      sentinel_net:
        ipv4_address: 172.20.0.40
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  sentinel_net:
    name: sentinel_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  vision_data:
  mosquitto_data:
  db_data:
