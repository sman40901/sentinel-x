# nginx — HTTPS pour le dashboard et l'API

server {
    listen 443 ssl;
    http2 on;
    server_name sentinelx.local 192.168.10.1;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # En-têtes de sécurité
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Limite la taille des requêtes (anti-DoS)
    client_max_body_size 1m;

    # Dashboard (fichiers statiques des DEV dans ./dashboard)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API : résolue à la demande, nginx démarre même si l'API n'est pas encore là
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket (temps réel du dashboard)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
