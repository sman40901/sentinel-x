# nginx — HTTPS : dashboard, API, MQTT WebSocket et flux webcam

server {
    listen 443 ssl;
    http2 on;
    server_name sentinelx.local 192.168.10.1 localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Résolution Docker à la demande : nginx démarre même si l'API ou l'IA ne tournent pas encore
    resolver 127.0.0.11 valid=10s ipv6=off;

    # En-têtes de sécurité
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m;   # anti-DoS

    # Authentification HTTP.
    #
    # Un audit a montre que /video/snapshot, /video/api/events (les photos
    # d'evenements) et /api/v1/mesures repondaient 200 sans identifiant :
    # n'importe qui sur le reseau pouvait regarder la camera en direct et
    # relire l'historique. C'est la porte d'entree qui manquait.
    #
    # /mqtt n'en a pas besoin : le CONNECT MQTT porte deja son propre couple
    # utilisateur/mot de passe, verifie par le broker contre son ACL. En
    # ajouter un deuxieme ne protegerait rien de plus.
    auth_basic           "Sentinel-X";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Dashboard (fichiers statiques)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # MQTT sur WebSocket pour le dashboard -> mosquitto:9001 (chiffré par le HTTPS de nginx)
    location /mqtt {
        set $mqtt_upstream http://mosquitto:9001;
        proxy_pass $mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        auth_basic off;
    }

    # API des DEV (quand elle sera lancée)
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Flux webcam MJPEG du script IA, qui tourne sur le PC (port 8080)
    location /video/ {
        rewrite ^/video/(.*)$ /$1 break;
        # Nom de service Docker, resolu par le DNS interne : le flux tourne
            # dans le meme reseau, rien ne passe par l'hote.
            proxy_pass http://stream:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # indispensable pour un flux vidéo continu
        proxy_read_timeout 1h;
    }
}
