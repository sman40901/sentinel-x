# nginx — HTTPS : dashboard, API, MQTT WebSocket et flux webcam

server {
    listen 443 ssl;
    http2 on;
    server_name sentinelx.local 192.168.10.1 localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Résolution Docker à la demande : nginx démarre même si l'API ou l'IA ne tournent pas encore
    resolver 127.0.0.11 valid=10s ipv6=off;

    # En-têtes de sécurité
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m;   # anti-DoS

    # Dashboard (fichiers statiques)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # MQTT sur WebSocket pour le dashboard -> mosquitto:9001 (chiffré par le HTTPS de nginx)
    location /mqtt {
        set $mqtt_upstream http://mosquitto:9001;
        proxy_pass $mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API des DEV (quand elle sera lancée)
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Flux webcam MJPEG du script IA, qui tourne sur le PC (port 8080)
    location /video/ {
        set $cam_upstream http://host.docker.internal:8080;
        rewrite ^/video/(.*)$ /$1 break;
        proxy_pass $cam_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;            # indispensable pour un flux vidéo continu
        proxy_read_timeout 1h;
    }
}
