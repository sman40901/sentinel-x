; Sentinel-X firmware — NodeMCU LoLin V3 / ESP8266MOD (ESP-12F)
;
; The board is an ESP8266, not an ESP32. If you see errors about
; WiFiClientSecure::setCACert or GPIO34, something is still on the old
; ESP32 target.
;
;   pio run                      build the default (dev) env
;   pio run -t upload            flash it
;   pio device monitor           115200 baud
;
; The ROM's own boot banner comes out at 74880 baud and looks like garbage
; at 115200. That is normal; your sketch's output starts right after it.

[env]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino

; The LoLin V3's CH340 shows up as /dev/ttyUSB0 on Linux. Override with
; `pio run -t upload --upload-port ...` if yours differs.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8

build_flags =
    -Iinclude
    ; PubSubClient's 256 B default cannot hold our telemetry payload.
    -DMQTT_MAX_PACKET_SIZE=512
    -DMQTT_KEEPALIVE=30

; ---------------------------------------------------------------
; Default: full build — sensors, LEDs, dashboard, presence, MQTT+TLS.
; All feature flags live in include/config.h; this env changes nothing.
; ---------------------------------------------------------------
[env:nodemcuv2]

; ---------------------------------------------------------------
; Standalone: no broker, no TLS, no Docker stack needed. Sensors +
; LEDs + the board's own dashboard only. Use this to demo the hardware
; on its own, and to free the ~22 kB of heap that TLS costs.
; ---------------------------------------------------------------
[env:nodemcuv2_standalone]
build_flags =
    ${env.build_flags}
    -DENABLE_MQTT=0
    -DWIFI_JOIN_STATION=0

; ---------------------------------------------------------------
; Low-heap: keeps MQTT+TLS but drops the presence sniffer and the IMU.
; Try this first if the board resets at random with TLS enabled.
; ---------------------------------------------------------------
[env:nodemcuv2_lowheap]
build_flags =
    ${env.build_flags}
    -DENABLE_PRESENCE=0
    -DENABLE_IMU=0
